name: Check Build

on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  changes:
    # Detect whether a PR touches anything other than docs. Output is consumed by
    # the build job to skip the artifact build (and the artifacts comment) when
    # only documentation changed. /build comments bypass this check entirely.
    #
    # The issue_comment trigger runs in the default-branch context with the repo
    # token, so gate /build on author association — only trusted maintainers may
    # build untrusted PR head code here (prevents cache poisoning / CWE-349).
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/build') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Allowlist: build only when files that actually feed into the
          # electron-vite + electron-builder output change. Anything outside
          # this list (docs, .github/, LICENSE, scripts unrelated to the bundle)
          # is treated as a no-op and skips the artifact build.
          filters: |
            code:
              - 'src/**'
              - 'resources/**'
              - 'package.json'
              - 'package-lock.json'
              - 'electron.vite.config.*'
              - 'tsconfig*.json'

  build:
    needs: changes
    if: >
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/build') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux zip
          - os: windows-latest
            platform: win
            args: --win zip
          - os: macos-latest
            platform: mac
            args: --mac zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Get PR branch
        if: github.event_name == 'issue_comment'
        id: get-pr
        shell: bash
        run: echo "ref=refs/pull/${{ github.event.issue.number }}/head" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.get-pr.outputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: ${{ github.event_name == 'pull_request' && 'npm' || '' }}

      - run: npm ci

      - run: npm run typecheck

      - name: Set PR build version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          PR_VERSION="${VERSION}-pr${PR_NUMBER}-$(date +%Y%m%d%H%M%S)"
          npm version "$PR_VERSION" --no-git-tag-version --allow-same-version

      - run: npx electron-vite build

      # Build as zip so artifacts have no bundled auto-updater / installer,
      # mirroring nightly builds. `--publish never` avoids electron-builder
      # resolving a null publisher.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract zip for single-layer artifact
        shell: bash
        run: |
          mkdir -p dist/extracted
          for f in dist/*.zip; do unzip -q "$f" -d dist/extracted/; done

      - uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_number }}-build-${{ matrix.platform }}
          path: dist/extracted/
          if-no-files-found: ignore
          retention-days: 3

  comment-artifacts:
    needs: build
    runs-on: ubuntu-latest
    # Run for non-draft PRs or when triggered by a /build comment from a trusted
    # maintainer (see the author-association gate on the build job).
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/build') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ github.event.issue.number || github.event.pull_request.number }}
          header: pr-artifacts
          recreate: true
          message: |
            ### 📦 PR Build Artifacts are ready!
            Portable zip builds (no installer, auto-updater disabled) — unzip and run.

            * 🍎 [macOS Build](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/pr-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_number }}-build-mac.zip)
            * 🪟 [Windows Build](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/pr-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_number }}-build-win.zip)
            * 🐧 [Linux Build](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/pr-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.run_number }}-build-linux.zip)

  quality:
    # Type-check, lint, format, unit tests, and the Electron boot smoke test.
    # Runs on every PR regardless of which files changed (cheap, no artifacts).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Before `npm ci`, because it needs no dependencies and because a version
      # below the base is a mistake to report in seconds rather than after the
      # e2e run. Unconditional rather than gated on `package.json` being in the
      # diff: a PR that does not touch it is equal to the base and passes
      # trivially, so the gate would buy nothing.
      #
      # That "equal to the base" premise rests on this job's checkout taking no
      # `ref`. On a `pull_request` event it therefore lands on
      # `refs/pull/N/merge` — the head merged into the *current* base tip, not
      # the head commit — so a PR that leaves `package.json` alone reads the base
      # tip's version verbatim, however far behind its branch point is. Against
      # the head commit the premise is false: a docs-only branch cut at 4.6.93
      # while `main` moved to 4.6.96 would read 4.6.93 and fail, with a
      # diagnostic that is a lie, since the merge keeps 4.6.96. The `build` job's
      # `Get PR branch` step pins `refs/pull/N/head` for its `/build` runs, so
      # this step does not survive being moved or copied there unchanged.
      #
      # The checkout above is depth 1 and fetches only the PR ref, so
      # `origin/$GITHUB_BASE_REF` does not resolve and the base's `package.json`
      # is not in the clone; the script fetches one shallow ref for it. This
      # reads the version *before* the `build` job's `Set PR build version`
      # rewrite, which lives in that job and never runs here.
      - name: Check the version is not lower than the base branch
        run: npm run check:version-not-lower

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run check:subscription-contract

      # `<path>:<line>` citations in comments and docs prose: fails on an anchor
      # that cannot resolve, and pins the count of anchors that land on a blank
      # line, a brace or a comment — the shape a stale one almost always takes
      # (#336). Nothing else in this job reads a number inside a comment.
      - run: npm run check:line-citations

      # Runs the full unit + integration suite with coverage instrumentation;
      # per-seam thresholds in vitest.config.ts fail the build on regression
      # (Phase 7, #140).
      - run: npm run test:coverage

      # The Playwright smoke + flow tests drive the built app.
      - run: npm run build

      - name: Install Electron runtime + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libgbm1 libasound2t64 libxshmfence1 libdrm2

      - name: Run Electron smoke test
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
