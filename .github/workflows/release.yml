name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # `git ls-remote`, not `git rev-parse`. The rev-parse form this replaces
      # was a no-op that always answered "no tag": `actions/checkout` runs
      # `git fetch --no-tags --depth=1` (the step log echoes `fetch-tags: false`),
      # so the working clone has no tags in it to parse and every run computed
      # `should_release=true` regardless. It went unnoticed because the guard's
      # answer was right by accident — a version bump lands once. `ls-remote`
      # asks origin instead and needs no fetch.
      #
      # Since #365 the tag is created only when the release actually publishes,
      # so a tag on origin now means "this version shipped" and nothing else. A
      # failed run leaves a draft and no tag, and stays retryable — which is the
      # whole point of moving tag creation last.
      - name: Check if the version has already shipped
        id: check-tag
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists on origin — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      # One platform failing must not cancel the other two: a partial matrix
      # still shows which targets are broken, which is the whole diagnostic
      # value of the run. The release job needs all three artifacts anyway, so
      # a genuine failure still blocks the release.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Signing + notarization env, scoped to the mac release build only
      # (never check.yml PR builds) and sourced from the ANIME_DL_* repo
      # secrets — see docs/build.md for the mapping. Degrades gracefully:
      # without ANIME_DL_CSC_LINK the build stays green but unsigned; with a
      # cert but no API key it signs without notarizing. The .p8 is written to
      # a file because @electron/notarize takes APPLE_API_KEY as a path.
      - name: Set up macOS signing & notarization
        if: matrix.platform == 'mac'
        env:
          CSC_LINK_B64: ${{ secrets.ANIME_DL_CSC_LINK }}
          CSC_KEY_PASSWORD_VAL: ${{ secrets.ANIME_DL_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.ANIME_DL_APPLE_API_KEY }}
          APPLE_API_KEY_ID_VAL: ${{ secrets.ANIME_DL_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VAL: ${{ secrets.ANIME_DL_APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK_B64" ]; then
            echo "ANIME_DL_CSC_LINK secret not set — building unsigned."
            exit 0
          fi
          {
            echo "CSC_LINK=$CSC_LINK_B64"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VAL"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VAL"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VAL"
            } >> "$GITHUB_ENV"
          else
            echo "ANIME_DL_APPLE_API_KEY secret not set — signing without notarization."
          fi

      - run: npx electron-vite build

      # One plain step for all three platforms. The macOS keychain failure that
      # once needed a retry leg here (#320, #327, #332) was an upstream defect:
      # importCerts passed the .p12 import password to
      # `security set-key-partition-list -k`, which wants the keychain's own
      # password. macOS <= 26.5 never checked `-k`; the runner image roll to
      # 26.6.2 started rejecting it. Fixed in app-builder-lib 26.16.1, which
      # `package.json` pins exactly. Keep it exact — not because a caret is
      # unsafe in principle (`^26.16.1` resolves forward to the fix today),
      # but because nothing gates a regression: `check.yml` packages `zip`
      # with `--publish never` and never touches the signing path, so a later
      # in-range 26.x that broke the same call would reach a release
      # unexercised. If it is ever widened, the range must admit nothing
      # below 26.16.1: npm resolves a range to the `latest` dist-tag whenever
      # `latest` satisfies it, in preference to any higher in-range version,
      # which is why `^26.8.1` — the range this replaced — resolved backwards
      # onto 26.15.3. As of 2026-09 `latest` is 26.15.3, the fix ships only
      # on the `v26` tag, and 26.15.4 through 26.16.0 are unfixed as well.
      #
      # `--publish never` is hygiene, not the fix for #365. Every build log shows
      # electron-builder already skipping every file
      # (`reason=release doesn't exist and not created because "publish" is not
      # "always" and build is not on tag`), so it has never published anything
      # here. It is worth pinning anyway on two counts: the same logs carry
      # `Implicit publishing triggered by CI detection. This behavior will be
      # disabled in electron-builder v27`, and the `release` job now creates its
      # draft *before* uploading — a pre-existing draft would let all three build
      # jobs publish into the very release the release job is writing to, which
      # is exactly the "asset the build did not produce" case the verifier reds
      # on. `check.yml` already builds this way.
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.dmg
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  # Draft first, verify, then publish, and only then does a tag exist.
  #
  # `softprops/action-gh-release` lost v4.6.92 and v4.6.93 the same way: it fires
  # every file at GitHub concurrently (13 uploads on v4.6.93), and when one large
  # binary answered `Error saving asset` ten seconds in, the four other large
  # binaries still in flight were abandoned with no log line. The action creates
  # every non-prerelease as a draft and flips `draft: false` only once all
  # artifacts have uploaded, so both versions were left as drafts carrying the
  # eight small files and none of the five ~100-140 MB binaries. See
  # scripts/release-assets.mjs for why the filename-collision theory was tested
  # and dropped.
  #
  # The draft-first mechanism is kept — it is the right shape, and it is what
  # makes a partial upload recoverable instead of publicly visible — but the
  # steps that decide when to leave it are explicit here rather than implicit in
  # an action. One `gh release upload` per file with its own retry means one
  # file's 5xx cannot take the others with it; the verify step reads the release
  # back and compares it against `artifacts/`, so a short release can never be
  # published; and the tag is created by the publish itself, so a run that fails
  # anywhere above leaves a draft, no tag, and a version that is still retryable.
  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check-version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` and no `npm ci`: this job runs a dependency-free script
      # and needs nothing from node_modules. Pinned anyway so a runner image
      # roll cannot change the Node the release path runs on.
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Idempotent on purpose: "Re-run failed jobs" has to reuse the draft a
      # previous attempt left behind rather than fail on it. `gh release view`
      # resolves drafts by tag, so this is a real lookup, not a guess. A draft
      # does NOT create the git tag — GitHub creates it at `--target` when the
      # release is published, which is the last step below.
      - name: Create or reuse the draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Reusing the draft release left by an earlier attempt."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --draft \
              --generate-notes
          fi

      # Never fails the job on its own — see the note in the script. `verify` is
      # the gate, and letting it run produces one authoritative list of what is
      # missing instead of two partly-overlapping ones.
      - name: Upload the artifacts
        run: node scripts/release-assets.mjs upload "$TAG" artifacts

      - name: Verify every artifact is attached
        run: node scripts/release-assets.mjs verify "$TAG" artifacts

      # Only reached when the asset set is complete. Un-drafting is what creates
      # the tag, so nothing above this line leaves a tag behind. `--latest`
      # preserves the `make_latest: true` the action defaulted to, which is what
      # `electron-updater` reads `latest.yml` from.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  # A failed release is otherwise silent: `release` is skipped, no release
  # appears, and nobody is told. That is how v4.6.56 was permanently lost
  # (#320). One issue per lost version, via the built-in GITHUB_TOKEN: a
  # "Re-run failed jobs" reuses the same run and re-runs this job, so a second
  # failure appends a comment to the open issue instead of filing a duplicate.
  report-failure:
    needs: [check-version, build, release]
    # Explicit rather than a bare failure(): when `build` fails, `release` is
    # skipped, and this spells out that a skipped dependency still counts. Does
    # not fire when the whole run is skipped (should_release == false) or
    # cancelled — only on a real failure, once per run.
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow default outright, so this is the
    # complete grant: filing/commenting needs `issues: write` and nothing else,
    # and every other job keeps the workflow's `contents: write`.
    permissions:
      issues: write

    steps:
      - name: Open an issue for the lost release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="${TAG:-(version unknown)}"
          {
            echo "The **Build & Release** run for \`$LABEL\` failed, so **no release was published**."
            echo
            echo "- Failed run: $RUN_URL"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo
            cat <<'EOF'
          ## Before you re-run this

          **First ask where the cause lives, not whether a release is newer.** A re-run replays the
          workflow *and the repo state* from this run's commit — `GITHUB_SHA` is pinned, so no fix
          landed on `main` afterwards can ever reach it.

          - **Transient cause** (upload blip, registry timeout, runner hiccup) → re-running can
            recover it, subject to the Latest check below.
          - **Cause lives in the repo** (a bad dependency, a broken build or workflow, a packaging
            config error) → **a re-run cannot fix it.** Fix it on `main` and ship the fix; if the
            fix touches `package.json` it cuts a release on merge, which recovers this untagged
            version without spending a new number. See #332 for a worked example.

          If the run got as far as the release job, there is a **draft** release for this version
          carrying whatever did upload. It is not public, no tag was created, and a re-run reuses
          that draft and retries only what is missing — so the version is still free. Do not
          publish the draft by hand: it is a draft precisely because the asset set is short, and a
          release missing its installers looks complete to anyone who finds it.

          Then, for the transient class only: the publish step passes `--latest`. If a **newer**
          version has been released since this run failed, re-running publishes the older version
          afterwards and marks **it** Latest — offering live users a downgrade through
          `electron-updater`. Check `gh release list`; if something newer exists, **do not re-run.**
          Leave the gap — the commit's code ships in the later release, and the abandoned draft can
          be deleted.
          EOF
          } > issue-body.md

          # Idempotent: "Re-run failed jobs" re-runs this job under the same
          # run id, and the title is version-scoped, so look for an open issue
          # first. The search is fuzzy and ranked, so the match is confirmed by
          # an exact title comparison before anything is written to it.
          TITLE="Release $LABEL failed to publish"
          # Fail open: if the search itself errors, EXISTING stays empty and we
          # still file. A lost release must never go unreported, so keep the
          # `|| true` even if this step ever gains a pipefail shell.
          EXISTING=$(gh issue list --state open --limit 100 \
            --search "in:title \"$TITLE\"" --json number,title |
            jq -r --arg title "$TITLE" \
              'map(select(.title == $title)) | .[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "::notice::Issue #$EXISTING already tracks this failure — commenting instead of filing a duplicate."
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
