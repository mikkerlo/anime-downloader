name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      should_release: ${{ steps.check-tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      # A macOS-only flake must not cancel the healthy linux/win legs (#320) —
      # the release job still needs all three, so a genuine failure blocks it.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux
          - os: windows-latest
            platform: win
            args: --win
          - os: macos-latest
            platform: mac
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Signing + notarization env, scoped to the mac release build only
      # (never check.yml PR builds) and sourced from the ANIME_DL_* repo
      # secrets — see docs/build.md for the mapping. Degrades gracefully:
      # without ANIME_DL_CSC_LINK the build stays green but unsigned; with a
      # cert but no API key it signs without notarizing. The .p8 is written to
      # a file because @electron/notarize takes APPLE_API_KEY as a path.
      - name: Set up macOS signing & notarization
        if: matrix.platform == 'mac'
        env:
          CSC_LINK_B64: ${{ secrets.ANIME_DL_CSC_LINK }}
          CSC_KEY_PASSWORD_VAL: ${{ secrets.ANIME_DL_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.ANIME_DL_APPLE_API_KEY }}
          APPLE_API_KEY_ID_VAL: ${{ secrets.ANIME_DL_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VAL: ${{ secrets.ANIME_DL_APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK_B64" ]; then
            echo "ANIME_DL_CSC_LINK secret not set — building unsigned."
            exit 0
          fi
          {
            echo "CSC_LINK=$CSC_LINK_B64"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VAL"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VAL"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VAL"
            } >> "$GITHUB_ENV"
          else
            echo "ANIME_DL_APPLE_API_KEY secret not set — signing without notarization."
          fi

      - run: npx electron-vite build

      # macOS only: electron-builder's temporary-keychain handling flakes with
      # "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" (#320). It is transient — the same secrets succeed minutes
      # later — so allow one retry. Capped at 2 attempts so a genuine cert or
      # secret problem still fails. Every other platform uses the
      # single-attempt step below, so a real build break fails on first try.
      #
      # The keychain reset between attempts is load-bearing, not hygiene.
      # electron-builder only tears its temporary keychain down on the success
      # path, so a failed attempt leaves that keychain on disk AND at the head
      # of the user search list. Its filename is derived from the certificate,
      # not randomised — the same basename appeared on two different runners —
      # so the next attempt targets that very path while generating a *fresh*
      # random password, and the unlock fails with the exact error the retry
      # exists to survive.
      #
      # Measured on a forced-failure probe (attempt 1 given a wrong
      # CSC_KEY_PASSWORD, attempt 2 the real one):
      #   without this reset  attempt1_rc=1 attempt2_rc=1  runs/33906796915
      #   with it             attempt1_rc=1 attempt2_rc=0  runs/33928659263
      - name: Package (mac, up to 2 attempts)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Quoted paths, one per line, as `security` prints them.
          list_keychains() {
            security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//'
          }
          ORIGINAL_KEYCHAINS=$(list_keychains)

          for attempt in 1 2; do
            echo "::group::electron-builder attempt $attempt of 2"
            if npx electron-builder ${{ matrix.args }}; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::electron-builder failed on both attempts."
              exit 1
            fi
            echo "::warning::electron-builder attempt $attempt failed — resetting keychain state and retrying once (see #320)."

            # Delete only the temporary keychains this attempt orphaned, then
            # put the search list back exactly as we found it. Scoped to the
            # temp dir so a pre-existing keychain is never destroyed.
            list_keychains | while read -r kc; do
              case "$kc" in
                */T/*.keychain | */T/*.keychain-db)
                  echo "removing orphaned keychain: $kc"
                  security delete-keychain "$kc" || true
                  ;;
              esac
            done
            # Word splitting is intended: one keychain path per argument.
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS
            echo "search list restored to:"
            list_keychains

            sleep 15
          done

      - name: Package
        if: matrix.platform != 'mac'
        run: npx electron-builder ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.dmg
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag
        run: |
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true

  # A failed release is otherwise silent: `release` is skipped, no release
  # appears, and nobody is told. That is how v4.6.56 was permanently lost
  # (#320). One issue per lost version, via the built-in GITHUB_TOKEN: a
  # "Re-run failed jobs" reuses the same run and re-runs this job, so a second
  # failure appends a comment to the open issue instead of filing a duplicate.
  report-failure:
    needs: [check-version, build, release]
    # Explicit rather than a bare failure(): when `build` fails, `release` is
    # skipped, and this spells out that a skipped dependency still counts. Does
    # not fire when the whole run is skipped (should_release == false) or
    # cancelled — only on a real failure, once per run.
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow default outright, so this is the
    # complete grant: filing/commenting needs `issues: write` and nothing else,
    # and every other job keeps the workflow's `contents: write`.
    permissions:
      issues: write

    steps:
      - name: Open an issue for the lost release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="${TAG:-(version unknown)}"
          {
            echo "The **Build & Release** run for \`$LABEL\` failed, so **no release was published**."
            echo
            echo "- Failed run: $RUN_URL"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo
            cat <<'EOF'
          ## Before you re-run this

          `softprops/action-gh-release` defaults to `make_latest: true`. If a **newer** version has
          been released since this run failed, re-running it publishes the older version afterwards
          and marks **it** Latest — offering live users a downgrade through `electron-updater`.

          Check `gh release list` first:

          - Nothing newer released yet → re-run the failed jobs; the release is recoverable.
          - A newer release already exists → **do not re-run.** Leave the version gap. The commit's
            code ships in the later release; a late rerun is not safe.

          The macOS keychain-unlock flake (#320) is the known cause; the mac packaging step already
          retries once, so a mac failure here means both attempts failed.
          EOF
          } > issue-body.md

          # Idempotent: "Re-run failed jobs" re-runs this job under the same
          # run id, and the title is version-scoped, so look for an open issue
          # first. The search is fuzzy and ranked, so the match is confirmed by
          # an exact title comparison before anything is written to it.
          TITLE="Release $LABEL failed to publish"
          # Fail open: if the search itself errors, EXISTING stays empty and we
          # still file. A lost release must never go unreported, so keep the
          # `|| true` even if this step ever gains a pipefail shell.
          EXISTING=$(gh issue list --state open --limit 100 \
            --search "in:title \"$TITLE\"" --json number,title |
            jq -r --arg title "$TITLE" \
              'map(select(.title == $title)) | .[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "::notice::Issue #$EXISTING already tracks this failure — commenting instead of filing a duplicate."
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
