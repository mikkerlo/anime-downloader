name: Shared Library e2e

# The two-instance Shared Library suite (#587): PC A exports With metadata, PC
# B opens the drive offline as a claim and watches, the drive comes back to A,
# A merges and drains to a stub Shikimori. Two built app instances under
# `xvfb-run -a`, local stubs for Shikimori and smotret, no real network. The
# spec lives in `e2e-shared-library/` under its own
# `playwright.shared-library.config.ts`, so the `quality` job's
# `npm run test:e2e` never collects it.
#
# Linux only: the per-OS checks (FAT32 / exFAT / NTFS, macOS, Windows) are the
# manual matrix in #587. Runs nightly, on dispatch, and on PRs that touch the
# Shared Library, the merge, the profile helper or the rig.

on:
  schedule:
    # 05:40 UTC, after the Syncplay nightlies, off the hour.
    - cron: '40 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/lib/shared-library/**'
      - 'src/main/lib/sync-merge/**'
      - 'src/main/lib/sync-state/**'
      - 'src/main/services/attached-library/**'
      - 'src/main/services/shared-library-export/**'
      - 'src/main/services/sync-runner/**'
      - 'src/main/services/shikimori-sync/**'
      - 'src/main/ipc/shared-library.ipc.ts'
      - 'src/renderer/src/components/shared-library/**'
      - 'src/renderer/src/components/sync/**'
      - 'e2e-shared-library/**'
      - 'e2e/helpers/profile.ts'
      - 'playwright.shared-library.config.ts'
      - 'scripts/ci-install-ffmpeg.sh'
      - 'scripts/ci-electron-libs.sh'
      - '.github/workflows/shared-library-e2e.yml'

permissions:
  contents: read

jobs:
  shared-library-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # `makeProfile()` links ffmpeg and ffprobe from PATH (`e2e/helpers/
      # profile.ts`), and the spec builds its clips with ffmpeg. Without this
      # step `assertNoDownloads()` fails on the first launch.
      - name: Install the app's pinned static ffmpeg
        timeout-minutes: 5
        run: bash scripts/ci-install-ffmpeg.sh

      - name: Check the Electron runtime libs and xvfb
        timeout-minutes: 12
        run: bash scripts/ci-electron-libs.sh

      - run: npm ci

      - run: npm run build

      - name: Run the two-instance suite
        # `shell: bash` for `pipefail`: the pipeline would otherwise exit with
        # `tee`'s 0. The npm script wraps the run in `xvfb-run -a`.
        shell: bash
        run: npm run test:e2e:shared-library 2>&1 | tee shared-library-e2e.log

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shared-library
          path: |
            playwright-report/
            test-results/shared-library/
            shared-library-e2e.log
          if-no-files-found: ignore
          retention-days: 14
