name: Syncplay e2e

# Tier 2 of the Syncplay interaction suite (#489): two built app instances in
# one room on a real Syncplay 1.7.6 server, playing generated fixture videos
# from a local server that slows every byte-range request. The specs live in
# `e2e-syncplay/` under their own `playwright.syncplay.config.ts`, so the
# blocking `quality` job's `npm run test:e2e` can never collect them.
#
# NON-BLOCKING until it has five consecutive green nightlies on its non-✗ rows
# (#489 Testing Strategy): the job is `continue-on-error`, so a red run here is
# news on the PR's checks list, not a merge gate. Runs nightly, on dispatch,
# and on PRs that touch the Syncplay client, the player view or the rig.
#
# SHARDED across three runners, one worker each (#530): `--shard=N/3` with the
# config's `fullyParallel: true` cuts the ordered test list into contiguous
# slices, not round-robin; `docs/testing.md` (Tier 2 Syncplay) has today's split,
# and `--shard=N/3 --list` prints the current one. Every shard gets a
# whole runner because the timing rows score races measured in milliseconds; a
# second worker on the same cores would skew them. Each shard uploads a blob
# report on every outcome, and `merge-reports` folds the three into one
# `playwright-report-syncplay` artifact. A row's `[syncplay-e2e] … bad=…` line
# is in the log of the shard that ran it.

on:
  schedule:
    # 05:10 UTC — after the 04:20 conformance nightly, off the hour.
    - cron: '10 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/main/syncplay.ts'
      - 'src/main/syncplay-*.ts'
      - 'src/main/ipc/syncplay.ipc.ts'
      - 'src/renderer/src/composables/use-syncplay-client.ts'
      - 'src/renderer/src/stores/syncplay.ts'
      - 'src/renderer/src/components/views/PlayerView.vue'
      - 'e2e-syncplay/**'
      - 'playwright.syncplay.config.ts'
      - 'conformance/helpers/real-server.ts'
      - 'scripts/gen-syncplay-fixtures.mjs'
      - 'scripts/ci-install-ffmpeg.sh'
      - 'scripts/ci-electron-libs.sh'
      - '.github/workflows/syncplay-e2e.yml'

permissions:
  contents: read

jobs:
  syncplay-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      # One red shard must not cancel the other two's evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Syncplay 1.7.6 from the pinned commit
        # The same commit as `syncplay-conformance.yml` (the commit, not the
        # tag; `--no-deps` plus what the server imports), and
        # `test/syncplay-e2e-workflow.test.ts` holds the two pins equal. Unlike
        # conformance, this rig passes `--tls` (the app's client is TLS-only),
        # so Twisted needs its `tls` extra: `server.py` imports `OpenSSL` inside
        # a bare `try/except: pass`, and without pyOpenSSL the server silently
        # answers `startTLS: "false"`. The import check fails provisioning
        # instead of every spec's StartTLS probe.
        run: |
          python3 -m venv "$RUNNER_TEMP/sp176"
          "$RUNNER_TEMP/sp176/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/sp176/bin/pip" install --no-deps \
            'git+https://github.com/Syncplay/syncplay@993232ab095bb810593459bc705b3e6fc64ad161'
          "$RUNNER_TEMP/sp176/bin/pip" install 'twisted[tls]' certifi pem
          "$RUNNER_TEMP/sp176/bin/python" -c 'import OpenSSL, service_identity'
          "$RUNNER_TEMP/sp176/bin/syncplay-server" --help > /dev/null

      # The app's own pinned static ffmpeg, then a check of the preinstalled
      # Electron libs with apt only as a timed fallback (#591): a slow apt
      # mirror once held a shard here for 2610 s and the job limit cancelled
      # its suite. The step budgets fail a stall as setup instead.
      - name: Install the app's pinned static ffmpeg
        timeout-minutes: 5
        run: bash scripts/ci-install-ffmpeg.sh

      - name: Check the Electron runtime libs and xvfb
        timeout-minutes: 12
        run: bash scripts/ci-electron-libs.sh

      - run: npm ci

      - run: npm run build

      - name: Generate the fixtures
        run: npm run gen:syncplay-fixtures

      - name: Run the two-instance suite
        # `shell: bash` for `pipefail`: a bare `run:` is `bash -e`, and the
        # pipeline would exit with `tee`'s 0 and land red rows as green. The
        # shard flag goes through the npm script, not a bare `npx playwright`:
        # the script is what wraps the run in `xvfb-run -a`, and Electron has
        # no display here without it.
        shell: bash
        env:
          SYNCPLAY_SERVER_BIN: ${{ runner.temp }}/sp176/bin/syncplay-server
          PYTHONUNBUFFERED: '1'
        run: npm run test:e2e:syncplay -- --shard=${{ matrix.shard }}/3 2>&1 | tee syncplay-e2e-${{ matrix.shard }}.log

      - name: Upload the blob report
        # On every outcome, not only on failure: the merge job builds the
        # report from whatever blobs exist, and a green shard's rows belong in
        # it too.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report-syncplay/
          retention-days: 1

      - name: Upload the per-row JSONL traces
        # Per-transition summaries plus bounded trace slices, sized for `jq`;
        # the raw wire logs are too large to read.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: syncplay-e2e-traces-${{ matrix.shard }}
          path: |
            syncplay-e2e-${{ matrix.shard }}.log
            test-results/syncplay-traces/
          if-no-files-found: ignore
          retention-days: 14

  merge-reports:
    # Folds the shards' blob reports into one HTML report. It runs after a red
    # shard too (the shards are `continue-on-error`), but not on a cancelled
    # run, which would spend a runner merging nothing. `npm ci` and no build:
    # the blob format is tied to the `@playwright/test` version, so the merge
    # runs the same one the shards did.
    needs: syncplay-e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          path: blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge the blob reports
        # `list` replays every shard's stdout in test order, so the job
        # summary gets each row's `[syncplay-e2e] … bad=…` line in one place.
        shell: bash
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-syncplay
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npx playwright merge-reports --reporter html,list blob-reports 2>&1 | tee merge-reports.log
          {
            echo '### Syncplay e2e rows, all shards'
            echo '```'
            grep -F '[syncplay-e2e]' merge-reports.log || echo '(no row summary lines)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the merged report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-syncplay
          path: playwright-report-syncplay/
          retention-days: 14
